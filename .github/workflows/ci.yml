# Continuous integration for pico-framework.
#
# The build matrix itself lives in scripts/ci.sh so it has one definition and a
# developer can reproduce a failure locally with `make ci` rather than by
# pushing (DESIGN_DOC.md section 19).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Only the direct submodule: this fetches the pinned Pico SDK without
          # dragging in every SDK submodule. tinyusb is added below.
          submodules: true

      - name: Initialise the SDK submodules the build needs
        run: |
          # USB stdio needs tinyusb. The wireless stacks (cyw43, lwIP, mbedTLS,
          # BTstack) are not needed until a component uses them, and each one
          # is a large clone.
          git -C lib/pico-sdk submodule update --init lib/tinyusb

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      # picotool turns the ELF into a UF2. Without it the SDK fetches and
      # builds picotool during configure, which costs a couple of minutes on
      # every run, so cache the build.
      - name: Cache picotool
        id: picotool-cache
        uses: actions/cache@v4
        with:
          path: ~/.picotool
          key: picotool-${{ runner.os }}-2.3.0

      - name: Build picotool
        if: steps.picotool-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config
          git clone --depth 1 --branch 2.3.0 https://github.com/raspberrypi/picotool.git /tmp/picotool
          cmake -S /tmp/picotool -B /tmp/picotool/build -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/lib/pico-sdk" \
            -DCMAKE_INSTALL_PREFIX="$HOME/.picotool"
          cmake --build /tmp/picotool/build
          cmake --install /tmp/picotool/build

      - name: Add picotool to PATH
        run: echo "$HOME/.picotool/bin" >> "$GITHUB_PATH"

      # Runs the host tests and the whole build matrix with warnings as errors,
      # and prints the toolchain and SDK versions that produced the binaries.
      - name: Run CI checks
        run: make ci

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/**/*.uf2
          if-no-files-found: warn
